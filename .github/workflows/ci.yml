name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: gym_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt ruff
      - run: ruff check app tests
      - run: pytest
        env:
          DATABASE_URL: postgresql+psycopg://gym:gym@localhost:5432/gym_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: gym
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gym:gym@localhost:5432/gym
      SCHEDULER_ENABLED: "false"
      RATE_LIMIT_ENABLED: "false"
      MEDIA_DIR: /tmp/gym-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start API with demo data
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m app.cli seed-demo
          nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
      - name: Install frontend and browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Start web app
        working-directory: frontend
        run: |
          nohup npx ng serve --port 4200 > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4200/login >/dev/null && curl -sf http://localhost:8000/api/health >/dev/null && break; sleep 2; done
      - name: Run end-to-end flows
        working-directory: frontend
        run: npx playwright test
      - name: Upload report and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            /tmp/api.log
            /tmp/web.log
