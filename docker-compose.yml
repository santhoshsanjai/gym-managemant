# Production-style stack for a single Linux VPS.
#   cp .env.example .env   # fill in secrets and DOMAIN
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gym}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gym}"]
      interval: 10s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gym}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gym}
      CORS_ORIGINS: '["https://${DOMAIN:-localhost}"]'
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      NGINX_ENVSUBST_FILTER: DOMAIN
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/proxy_params_gym:/etc/nginx/proxy_params_gym:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    depends_on: [api, web]

volumes:
  pgdata:
