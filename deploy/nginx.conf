# Edge reverse proxy: HTTPS termination, rate limits, routing.
# Certificates come from Let's Encrypt (certbot, webroot mode).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=checkin:10m rate=20r/m;

server {
  listen 80;
  server_name ${DOMAIN};
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name ${DOMAIN};

  ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Camera is needed for QR scanning on this origin only.
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

  client_max_body_size 2m;

  location = /api/auth/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://api:8000;
    include /etc/nginx/proxy_params_gym;
  }
  location = /api/attendance/check-in {
    limit_req zone=checkin burst=5 nodelay;
    proxy_pass http://api:8000;
    include /etc/nginx/proxy_params_gym;
  }
  location /api/ {
    proxy_pass http://api:8000;
    include /etc/nginx/proxy_params_gym;
  }
  location / {
    proxy_pass http://web:80;
    include /etc/nginx/proxy_params_gym;
  }
}
