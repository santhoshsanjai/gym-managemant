# Serves the Angular build inside the frontend container. TLS and /api
# routing are handled by the edge proxy (deploy/nginx.conf).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location = /ngsw-worker.js { add_header Cache-Control "no-cache"; }
  location = /ngsw.json { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location ~* \.(js|css|png|svg|ico|woff2?)$ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
